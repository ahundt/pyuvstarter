name: pyuvstarter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:  # Allow publish.yml to reuse this workflow

permissions:
  contents: read
  checks: write
  pull-requests: write  # Required for EnricoMi/publish-unit-test-result-action to comment on PRs
  issues: read  # Required to read PR information

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Python 3.14 is prerelease; allow it to fail without blocking the build
          - python-version: "3.14"
            experimental: true
        exclude:
          # macOS runners are expensive, so only test on latest Python
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          # Windows can be flaky with older Python
          - os: windows-latest
            python-version: "3.11"
    continue-on-error: ${{ matrix.experimental == true }}

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      PYUVSTARTER_TEST_OS: ${{ matrix.os }}
      PYUVSTARTER_TEST_PYTHON: ${{ matrix.python-version }}
      NO_COLOR: "1"  # Suppress Rich ANSI codes for stable test output assertions

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install uv using official installer (Unix)
      if: runner.os != 'Windows'
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install uv using official installer (Windows)
      if: runner.os == 'Windows'
      run: |
        irm https://astral.sh/uv/install.ps1 | iex
        echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install pyuvstarter dependencies
      run: |
        # Use explicit version + UV_PYTHON env var for maximum robustness
        uv venv --python ${{ matrix.python-version }}
        uv sync

    - name: Verify Python version in venv
      run: |
        uv run python --version
        echo "Expected: Python ${{ matrix.python-version }}"
        echo "UV_PYTHON env var: $UV_PYTHON"

    - name: Check Python syntax
      run: |
        uv run python -m py_compile pyuvstarter.py

    - name: Build pyuvstarter package
      run: |
        # Build the package using uv
        uv build

    - name: Install pyuvstarter (editable)
      run: |
        uv pip install -e .

    - name: Install pyuvstarter as tool
      run: |
        # Install pyuvstarter as a global tool with explicit Python version + UV_PYTHON env var
        uv tool install . --python ${{ matrix.python-version }}

    - name: Test pyuvstarter as installed package
      run: |
        # Test that pyuvstarter can be run as an installed command
        uv run pyuvstarter --version

    - name: Test pyuvstarter in isolated environment (Unix)
      if: runner.os != 'Windows'
      run: |
        echo "🧪 INTEGRATION TEST: Isolated environment"
        echo "========================================="
        TEST_FAILED=0
        # Create isolated test environment with explicit Python version + UV_PYTHON env var
        cd ${{ runner.temp }}
        uv venv test-env --python ${{ matrix.python-version }}
        source test-env/bin/activate
        # Verify Python version matches expected
        echo "🔍 Python version in isolated env:"
        python --version
        echo "Expected: Python ${{ matrix.python-version }}"
        echo "UV_PYTHON=$UV_PYTHON"
        # Install from the built wheel using uv
        uv pip install ${{ github.workspace }}/dist/pyuvstarter-*.whl
        # Test the installed command
        echo "🔍 Testing installed command:"
        pyuvstarter --version
        mkdir isolated-test
        cd isolated-test
        echo "📁 Running pyuvstarter in isolated directory: $(pwd)"
        pyuvstarter
        echo "🔍 Verifying generated files:"
        if test -f pyproject.toml; then echo "  ✅ pyproject.toml exists"; else echo "  ❌ pyproject.toml NOT FOUND"; ((TEST_FAILED++)); fi
        echo ""
        if [ $TEST_FAILED -eq 0 ]; then
          echo "✅ Isolated environment test passed"
        else
          echo "❌ Isolated environment test FAILED ($TEST_FAILED checks failed)"
          exit $TEST_FAILED
        fi

    - name: Test pyuvstarter in isolated environment (Windows)
      if: runner.os == 'Windows'
      run: |
        Write-Host "🧪 INTEGRATION TEST: Isolated environment (Windows)"
        Write-Host "================================================="
        $TEST_FAILED = 0
        # Create isolated test environment with explicit Python version + UV_PYTHON env var
        cd $env:RUNNER_TEMP
        uv venv test-env --python ${{ matrix.python-version }}
        . test-env\Scripts\activate
        # Verify Python version matches expected
        Write-Host "🔍 Python version in isolated env:"
        python --version
        Write-Host "Expected: Python ${{ matrix.python-version }}"
        Write-Host "UV_PYTHON=$env:UV_PYTHON"
        # Install from the built wheel
        $wheel = Get-ChildItem "${{ github.workspace }}\dist\*.whl" | Select-Object -First 1
        uv pip install $wheel.FullName
        # Test the installed command
        Write-Host "🔍 Testing installed command:"
        pyuvstarter --version
        mkdir isolated-test
        cd isolated-test
        Write-Host "📁 Running pyuvstarter in isolated directory: $(Get-Location)"
        pyuvstarter
        Write-Host "🔍 Verifying generated files:"
        if (Test-Path "pyproject.toml") { 
          Write-Host "  ✅ pyproject.toml exists" 
        } else { 
          Write-Host "  ❌ pyproject.toml NOT FOUND"
          $TEST_FAILED++
        }
        Write-Host ""
        if ($TEST_FAILED -eq 0) {
          Write-Host "✅ Isolated environment test passed"
        } else {
          Write-Host "❌ Isolated environment test FAILED ($TEST_FAILED checks failed)"
          exit $TEST_FAILED
        }

    - name: Lint check with ruff (via uvx)
      # Only check for actual errors, not style issues
      # E501: line too long (we don't enforce line length)
      # E722: bare except (sometimes needed for robustness)
      # F401: imported but unused (might be used in type annotations)
      run: |
        uvx ruff check . --select=E9,F63,F7,F82 --show-files || true
        # Run full check but don't fail the build
        uvx ruff check . --exit-zero

    - name: Run unit tests (Unix)
      if: runner.os != 'Windows'
      working-directory: ${{ github.workspace }}
      run: |
        chmod +x create_demo.sh create_demo2.sh

        echo ""
        echo "Running Python unit tests (pytest)..."
        echo "======================================="
        uv run python -m pytest tests/ --junitxml=test_results_pytest.xml --tb=short
        PYTEST_EXIT_CODE=$?

        # Run the demo script tests
        echo ""
        echo "Running create_demo2.sh unit tests..."
        echo "DEBUG: UNIT_TEST_MODE and file generation check:"
        ./create_demo2.sh --unit-test --demo-dir "${{ runner.temp }}/pyuvstarter_demo2"
        DEMO2_EXIT_CODE=$?

        echo "DEBUG: Copying test results from demo directory..."
        if [ -f "${{ runner.temp }}/pyuvstarter_demo2/test_results.xml" ]; then
          cp "${{ runner.temp }}/pyuvstarter_demo2/test_results.xml" ./
          echo "✅ Copied test_results.xml from demo directory"
        else
          echo "⚠️  test_results.xml not found in demo directory"
        fi

        echo "DEBUG: Checking for test_results.xml..."
        ls -la test_results* || echo "No test_results* files found"

        echo "Running create_demo.sh unit tests..."
        ./create_demo.sh --unit-test --demo-dir "${{ runner.temp }}/pyuvstarter_demo1"
        DEMO1_EXIT_CODE=$?

        echo "DEBUG: Checking for test results from demo1..."
        if [ -f "${{ runner.temp }}/pyuvstarter_demo1/test_results.xml" ]; then
          cp "${{ runner.temp }}/pyuvstarter_demo1/test_results.xml" ./test_results_demo1.xml
          echo "✅ Copied test_results_demo1.xml from demo1 directory"
        fi

        # Run comprehensive test suite
        echo ""
        echo "🧪 Running comprehensive test suite..."
        echo "===================================="
        chmod +x tests/run_all_tests.sh 2>/dev/null || true
        if [ -f "tests/run_all_tests.sh" ]; then
          ./tests/run_all_tests.sh
          COMPREHENSIVE_EXIT_CODE=$?

          echo "DEBUG: Checking for comprehensive test results..."
          # Comprehensive tests might generate test results in different locations
          if [ -f "test_results.xml" ]; then
            echo "✅ Found test_results.xml from comprehensive tests"
          elif [ -f "tests/test_results.xml" ]; then
            cp tests/test_results.xml ./test_results_comprehensive.xml
            echo "✅ Copied test_results_comprehensive.xml from tests directory"
          fi
        else
          echo "⚠️  Comprehensive test runner not found - skipping"
          COMPREHENSIVE_EXIT_CODE=0
        fi

        # Check if any test suite failed
        if [ $PYTEST_EXIT_CODE -ne 0 ] || [ $DEMO2_EXIT_CODE -ne 0 ] || [ $DEMO1_EXIT_CODE -ne 0 ] || [ $COMPREHENSIVE_EXIT_CODE -ne 0 ]; then
          echo "❌ Unit tests failed"
          echo "Python unit tests exit code: $PYTEST_EXIT_CODE"
          echo "Demo1 exit code: $DEMO1_EXIT_CODE"
          echo "Demo2 exit code: $DEMO2_EXIT_CODE"
          echo "Comprehensive test exit code: $COMPREHENSIVE_EXIT_CODE"
          exit 1
        fi
        echo "✅ All unit tests passed"

        # Final check for all test results before publishing
        echo ""
        echo "DEBUG: Final check for all test result files before publishing..."
        ls -la test_results*.xml || echo "No test_results*.xml files found for publishing"

    - name: Publish Test Results
      uses: dorny/test-reporter@d61b558e8df85cb60d09ca3e5b09653b4477cea7 # v1
      if: always()
      with:
        name: "pyuvstarter Tests (${{ matrix.os }}, py${{ matrix.python-version }})"
        path: test_results*.xml
        reporter: java-junit
        fail-on-error: false

    - name: Run unit tests (Windows)
      if: runner.os == 'Windows'
      run: |
        Write-Host "🧪 WINDOWS UNIT TEST: Python unit tests + basic project creation"
        Write-Host "================================================================"
        $TEST_FAILED = 0
        # Run Python unit tests with JUnit XML output for dorny/test-reporter
        uv run python -m pytest tests/ --junitxml=test_results_pytest_windows.xml --tb=short
        if ($LASTEXITCODE -ne 0) { $TEST_FAILED++ }
        # Windows doesn't support the bash demo script, so also run pyuvstarter directly
        uv run pyuvstarter --help
        if ($LASTEXITCODE -ne 0) { $TEST_FAILED++; Write-Host "  ❌ pyuvstarter --help failed" }
        mkdir test_windows
        cd test_windows
        Write-Host "📁 Created test directory: $(Get-Location)"
        Write-Host "🚀 Running: uv tool run pyuvstarter ."
        uv tool run pyuvstarter .
        if ($LASTEXITCODE -ne 0) { $TEST_FAILED++; Write-Host "  ❌ uv tool run pyuvstarter . failed" }
        Write-Host ""
        Write-Host "🔍 Verifying generated files:"
        if (Test-Path "pyproject.toml") { 
          Write-Host "  ✅ pyproject.toml exists" 
        } else { 
          Write-Host "  ❌ pyproject.toml NOT FOUND"
          $TEST_FAILED++
        }
        Write-Host ""
        if ($TEST_FAILED -eq 0) {
          Write-Host "✅ Windows test passed"
        } else {
          Write-Host "❌ Windows test FAILED ($TEST_FAILED checks failed)"
          exit $TEST_FAILED
        }

    - name: Run integration test - New project
      if: runner.os != 'Windows'
      run: |
        chmod +x tests/test_new_project.sh
        cd "$(mktemp -d)"
        ${{ github.workspace }}/tests/test_new_project.sh

    - name: Run integration test - Legacy project migration
      if: runner.os != 'Windows'
      run: |
        chmod +x tests/test_legacy_migration.sh
        cd "$(mktemp -d)"
        ${{ github.workspace }}/tests/test_legacy_migration.sh

